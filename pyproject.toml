[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantive-terminal"
version = "0.1.0"
description = "Self-hosted signal executor for automated crypto trading"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
quantive-terminal = "quantive_terminal.main:main"

[tool.setuptools.packages.find]
where = ["src"]
